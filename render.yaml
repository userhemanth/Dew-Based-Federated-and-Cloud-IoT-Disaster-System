services:
  # 1. FastAPI Backend Service
  - type: web
    name: disaster-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.iot_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Streamlit Dashboard Service
  - type: web
    name: disaster-dashboard
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run frontend/streamlit_dashboard.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # Link the frontend to the backend's Render URL
      - key: BACKEND_URL
        fromService:
          type: web
          name: disaster-backend
          property: host

